name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Exit codes
        shell: bash
        run: |
          swift build --product why-foundation
          bin=.build/debug/why-foundation
          "$bin" -p Fixtures/clean
          set +e
          "$bin" -p Fixtures/resources; test $? = 1 || exit 1
          "$bin" -p Fixtures/conflict; test $? = 2 || exit 1

  linux:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Exit codes
        shell: bash
        run: |
          swift build --product why-foundation
          bin=.build/debug/why-foundation
          "$bin" -p Fixtures/clean
          set +e
          "$bin" -p Fixtures/resources; test $? = 1 || exit 1
          "$bin" -p Fixtures/conflict; test $? = 2 || exit 1
